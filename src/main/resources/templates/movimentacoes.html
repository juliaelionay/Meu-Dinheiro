
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Minhas Movimentações | Meu Dinheiro</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<section class="page-section">
		<main class="page-container">

			<div class="page-header">
				<h1>Minhas movimentações</h1>
				<p th:text="|Olá, ${nomeUsuario}! Sua conta está conectada.|">
					Olá! Sua conta está conectada.</p>
			</div>

			<!-- RESUMO FINANCEIRO -->
			<div class="summary-grid">

				<div class="summary-card income">
					<span>Total de entradas</span> <strong
						th:text="${'R$ ' + #numbers.formatDecimal(totalEntradas, 1, 'POINT', 2, 'COMMA')}">
						R$ 0,00 </strong>
				</div>

				<div class="summary-card expense">
					<span>Total de despesas</span> <strong
						th:text="${'R$ ' + #numbers.formatDecimal(totalDespesas, 1, 'POINT', 2, 'COMMA')}">
						R$ 0,00 </strong>
				</div>

				<div class="summary-card balance">
					<span>Saldo atual</span> <strong
						th:text="${'R$ ' + #numbers.formatDecimal(saldo, 1, 'POINT', 2, 'COMMA')}">
						R$ 0,00 </strong>
				</div>

			</div>

			<!-- AÇÕES -->
			<div class="page-actions">

				<a th:href="@{/usuario/movimentacoes/nova}" class="btn-primary">
					+ Nova movimentação </a>

				<form th:action="@{/logout}" method="post">
					<button type="submit" class="btn-primary">Sair da conta</button>
				</form>

			</div>

			<!-- TABELA DE MOVIMENTAÇÕES -->
			<div class="page-card">
				<div class="table-container">

					<table class="movements-table">
						<thead>
							<tr>
								<th>Descrição</th>
								<th>Valor</th>
								<th>Data</th>
								<th>Tipo</th>
								<th>Ações</th>
							</tr>
						</thead>

						<tbody>

							<tr th:each="movimentacao : ${movimentacoes}">

								<td th:text="${movimentacao.descricao}"></td>

								<td
									th:text="${'R$ ' + #numbers.formatDecimal(movimentacao.valor, 1, 'POINT', 2, 'COMMA')}"
									th:classappend="${movimentacao.tipo == 'ENTRADA'} ? 'income' : 'expense'">
								</td>

								<td th:text="${movimentacao.data}"></td>

								<td th:text="${movimentacao.tipo}"></td>

								<td class="movement-actions"><a
									th:href="@{/usuario/movimentacoes/editar/{id}(id=${movimentacao.id})}"
									class="btn-edit"> Editar </a>

									<form
										th:action="@{/usuario/movimentacoes/excluir/{id}(id=${movimentacao.id})}"
										method="post"
										onsubmit="return confirm('Deseja realmente excluir esta movimentação?');">

										<button type="submit" class="btn-delete">Excluir</button>

									</form></td>
							</tr>

							<tr th:if="${#lists.isEmpty(movimentacoes)}">
								<td colspan="5" class="empty-message">Nenhuma movimentação
									cadastrada.</td>
							</tr>

						</tbody>
					</table>

				</div>
			</div>

		</main>
	</section>

</body>
</html>
