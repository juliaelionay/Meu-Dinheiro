
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Nova Movimentação | Meu Dinheiro</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<section class="page-section">
		<main class="page-container">

			<div class="page-header">
				<h1>Nova movimentação</h1>
				<p>Registre uma entrada ou despesa na sua conta.</p>
			</div>

			<div class="page-card">

				<form th:action="@{/usuario/movimentacoes/salvar}"
					th:object="${movimentacao}" method="post">

					<div class="form-group">
						<label>Descrição</label> <input type="text"
							th:field="*{descricao}"
							placeholder="Ex.: Salário, alimentação..." required>
					</div>

					<div class="form-group">
						<label>Valor (R$)</label> <input type="number" th:field="*{valor}"
							step="0.01" min="0.01" placeholder="0,00" required>
					</div>

					<div class="form-group">
						<label>Data</label> <input type="date" th:field="*{data}" required>
					</div>

					<div class="form-group">
						<label>Tipo de movimentação</label> <select th:field="*{tipo}"
							required>
							<option value="">Selecione</option>
							<option value="ENTRADA">Entrada</option>
							<option value="DESPESA">Despesa</option>
						</select>
					</div>

					<div class="page-actions">
						<button type="submit" class="btn-primary btn-full">
							Salvar movimentação</button>

						<a th:href="@{/usuario/movimentacoes}" class="page-link">Cancelar</a>
					</div>

				</form>

			</div>
		</main>
	</section>

</body>
</html>
